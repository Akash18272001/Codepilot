apiVersion: apps/v1
kind: Deployment
metadata:
  name: codepilot-agent
  namespace: default
  labels:
    app: codepilot-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codepilot-agent
  template:
    metadata:
      labels:
        app: codepilot-agent
    spec:
      containers:
      - name: agent
        image: your-dockerhub-username/codepilot-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: codepilot-config
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: codepilot-secrets
              key: GITHUB_TOKEN
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: codepilot-agent-svc
namespace: default
spec:
  type: ClusterIP
  selector:
    app: codepilot-agent
  ports:
  - port: 80
    targetPort: 8080