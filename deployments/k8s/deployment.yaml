apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-backend
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: agent-backend
        image: ai-agent-backend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: "http://ollama-service:11434"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
spec:
  type: NodePort
  selector:
    app: ai-agent
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
